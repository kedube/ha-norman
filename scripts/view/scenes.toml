# The photographs the sidebar page's windows look out on, and how each one moves.
#
# scripts/build_view.py reads this table, fetches each photograph from Wikimedia Commons, cuts
# the strip of it that ships (custom_components/norman/www/view) and writes their index,
# scenes.json. Nothing is retouched: a photograph is only cropped and resized.
#
# Every photograph is CC0 or in the public domain. Keep it that way: a photograph that needs
# attribution in a particular form, or forbids changes, cannot be cut and set moving here.
#
# One table per scene, named <place>-<when>. The page shows the scene whose <when> matches the
# weather first, then the height of the sun: dawn, day, partly, cloudy, fog, rain, storm, snow,
# golden, sunset, dusk, twilight or night. A place without one borrows the other place's.
#
#   source    the file's title on Wikimedia Commons
#   author    who to credit, as the page shows it
#   license   "CC0" or "Public domain"
#   title     what the photograph shows, in English (documentation and the NOTICE file)
#   where     where it was taken, as the page shows it; "" when the source does not say
#   tone      "night" for a photograph taken after dark (it is not dimmed again once the sun
#             is down)
#   trim      optional: left, top, right, bottom of the part to keep, as shares of the original
#   strip     the part the windows look out on, two wide by one high: where it sits, as x%, y%
#             the way CSS object-position places a picture, and optionally its width as a share
#             of the picture's (all of it when not given). A room's row of windows looks out on
#             the whole strip, each window on the part behind it.
#
# How it moves. Speeds are picture-widths a second, across then down; the third number is how
# many seconds one blend of the picture with itself takes. Positions (horizon, fall) are shares
# of the whole photograph, not of the strip.
#
#   sky       the drift of the clouds
#   water     the drift of the water
#   horizon   where the sky meets the water (0 top, 1 bottom) when the map of the sky gets it
#             wrong, as it does in fog
#   fall      a curtain of rain that is in the photograph: its box (left, top, right, bottom),
#             then speed, seconds, lean and soft edge
#   rain, snow, fog, storm, stars
#             how much of each: rain and snow fall through the air, fog drifts across, a storm's
#             own lightning flickers, the photograph's own stars twinkle
#   ambient   the light that rain and snow catch: red, green, blue
#   moon      true where the moon may hang
#   glare     the sun's glare from above the picture in the middle of the day
#   birds     the kinds that cross this sky; a kind listed twice comes twice as often
#   light     how those birds are lit: day, morning, golden, sunset, dusk or overcast


