name: Release

# Started by hand from Actions -> Release -> Run workflow. A push to main only runs CI.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = re-release current manifest version)"
        required: true
        default: "minor"
        type: choice
        options:
          - minor
          - major
          - none

permissions:
  contents: write
  # Read CI's runs, to check the commit being released passed.
  actions: read

concurrency:
  group: release-main
  # A second release waits; cancelling one after its push would leave a bump with no tag.
  cancel-in-progress: false

jobs:
  release:
    name: Bump manifest and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      # Nothing waits for CI before a release any more, so check it passed on this commit.
      - name: Require a green CI run on main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

          tested="$head_sha"
          # Release commits are pushed with [skip ci]; CI ran on the commit before one.
          if [[ "$(git log -1 --format=%s "$tested")" == chore\(release\):*\ \[skip\ ci\] ]]; then
            tested="$(git rev-parse "$tested^")"
          fi

          run="$(gh run list --workflow ci.yml --commit "$tested" --limit 1 \
            --json conclusion,url --jq '.[0] // empty')"
          if [ -z "$run" ]; then
            echo "::error::No CI run found for $tested. Run CI on main, then release."
            exit 1
          fi
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          url="$(jq -r '.url' <<< "$run")"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI on $tested is ${conclusion:-still running}: $url"
            exit 1
          fi
          echo "CI passed on $tested: $url"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Only runs the three stdlib-only scripts in .github/scripts, so this does not need
          # to match the 3.14 the test jobs use -- but keeping them equal means one version to
          # bump instead of two, and no chance of the release path hitting syntax the tests
          # never exercised.
          python-version: '3.14'

      - name: Bump manifest version and rotate changelog
        if: inputs.bump != 'none'
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          new_version="$(python .github/scripts/bump_manifest_version.py --bump "$BUMP_TYPE")"
          python .github/scripts/update_changelog.py "$new_version"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Read existing manifest version
        if: inputs.bump == 'none'
        id: current_version
        run: |
          new_version="$(python -c 'import json; print(json.load(open("custom_components/norman/manifest.json"))["version"])')"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        if: inputs.bump != 'none'
        id: commit_release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/norman/manifest.json CHANGELOG.md
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          echo "release_target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit
        if: inputs.bump != 'none'
        run: git push origin HEAD:main

      # GitHub's auto-generated notes only list merged PRs, so direct-to-main releases came
      # out empty. Build the body ourselves: Highlights from CHANGELOG.md (rotated from its
      # Unreleased section during the bump) plus the commit list since the previous tag.
      - name: Generate release notes
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
        run: python .github/scripts/generate_release_notes.py "$NEW_VERSION" release_notes.md

      - name: Create GitHub release
        uses: actions/github-script@v9
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
          RELEASE_TARGET: ${{ steps.commit_release.outputs.release_target || steps.head.outputs.sha }}
        with:
          script: |
            const fs = require('fs')
            const tag = process.env.NEW_VERSION
            const target = process.env.RELEASE_TARGET
            const body = fs.readFileSync('release_notes.md', 'utf8')
            const { owner, repo } = context.repo

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              })
              core.info(`Release ${tag} already exists; skipping creation.`)
              return
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              body,
            })
