# Home Assistant integration quality scale checklist. The manifest declares "custom" (the only
# value Home Assistant honours for a custom integration); see QUALITY_SCALE.md for the reasoning
# behind each status below.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      Local push drives refreshes. An optional poll (off by default, configurable in the
      options) backs it up for sleeping battery blinds, which the hub stops reporting on.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The hub has no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The cover device class provides the icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: Nothing is user-fixable beyond the hub address, which reconfigure covers.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
