nudge_position:
  name: Nudge position
  description: Move a cover by a relative amount from where it is heading (or is).
  target:
    entity:
      integration: norman
      domain: cover
  fields:
    step:
      name: Step
      description: Amount to move by, -100 to 100. Positive opens, negative closes.
      example: 10
      required: true
      selector:
        number:
          min: -100
          max: 100
          mode: box
nudge_tilt:
  name: Nudge tilt
  description: Adjust a cover's tilt by a relative amount from where it is heading (or is).
  target:
    entity:
      integration: norman
      domain: cover
      supported_features:
        - cover.CoverEntityFeature.SET_TILT_POSITION
  fields:
    step:
      name: Step
      description: Amount to tilt by, -100 to 100. Direction depends on the blind; for SmartDrape, negative tilts left.
      example: 10
      required: true
      selector:
        number:
          min: -100
          max: 100
          mode: box
room_command:
  name: Room command
  description: >-
    Run one of the Norman app's room buttons against every blind in a room, in a single
    request to the hub.
  fields:
    room:
      name: Room
      description: The room's name as the hub knows it (the Norman app's room name).
      example: Office
      required: true
      selector:
        text:
    command:
      name: Command
      description: >-
        best_privacy closes the bottom rail and leaves the middle rail where it is;
        best_view opens the bottom rail; favorite sends the room to its stored favorite.
      required: true
      selector:
        select:
          options:
            - best_privacy
            - best_view
            - favorite
    config_entry_id:
      name: Hub
      description: Which hub, when more than one is set up.
      required: false
      selector:
        config_entry:
          integration: norman
get_hub_data:
  name: Get hub data
  description: Read the hub's raw device list and status, exactly as the hub sends them. Returns a response; use it from Developer Tools or a script when reporting an unsupported blind.
  fields:
    config_entry_id:
      name: Hub
      description: Which Norman hub to read. Optional when only one is configured.
      required: false
      selector:
        config_entry:
          integration: norman
send_hub_command:
  name: Send hub command
  description: Advanced. POST arbitrary fields to the hub's control endpoint for one blind and return the reply. For the hub verbs that have no entity of their own, such as setting or clearing a limit and calibration. The blind will do whatever the hub makes of the fields.
  fields:
    config_entry_id:
      name: Hub
      description: Which Norman hub to send to. Optional when only one is configured.
      required: false
      selector:
        config_entry:
          integration: norman
    peripheral_uid:
      name: Peripheral UID
      description: The blind's id as the hub reports it (the cover's unique id, or PeripheralUID in get_hub_data).
      required: true
      example: 58850
      selector:
        number:
          min: 0
          max: 4294967295
          mode: box
    fields:
      name: Fields
      description: Extra JSON fields for the control call. PeripheralUID, Timestamp and TaskID are filled in automatically.
      required: true
      example: '{"MotorStop": 1}'
      selector:
        object:
