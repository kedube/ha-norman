[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Deliberately one behind the 3.14 the CI jobs run on. Bumping this to py314 makes ruff's
# formatter rewrite `except (TypeError, ValueError):` into PEP 758's unparenthesized form,
# which is a syntax error on 3.13 -- so the source would no longer even import for anyone
# on an older interpreter, in exchange for nothing. Revisit once 3.13 is not worth
# supporting; the CI jobs pin the runtime independently of this.
target-version = "py313"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.norman"]

[tool.ruff.format]
line-ending = "lf"
