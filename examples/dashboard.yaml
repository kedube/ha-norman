# Example Home Assistant dashboard for the Norman integration.
#
# HOW TO USE THIS FILE
#
# Storage-mode dashboards (the default, edited in the UI) cannot include a YAML file, so
# copy the piece you want instead:
#
#   1. Open the dashboard, then Edit dashboard > three-dot menu > Raw configuration editor.
#   2. Paste the `views:` entry you want, or the whole file to replace the dashboard.
#   3. Save.
#
# YAML-mode dashboards can use this file as-is, but must also declare the card themselves --
# an integration cannot write to a YAML-mode resource list. See docs/dashboard.md ("Adding
# it") for the resource entry and the exact URL, which is logged at startup.

# The dashboard's own title and its view tab; the card below names your hub, not itself.
title: Shades
views:
  - title: Shades
    path: shades
    icon: mdi:blinds-horizontal
    cards:
      - type: custom:norman-shades-card
        # No title: the card names your hub. Set one to override it.